[project]
name = "openmost-full-text-extraction"
version = "0.1.0"
description = "Retrieve DOIs and full-text XML from the Elsevier API (TR-doi.ipynb, TR.ipynb)."
requires-python = "==3.10.*"
# No original environment was recorded for this folder. Versions are pinned to
# match the overlapping packages of feature-extraction's original conda env
# (feature-extraction/requirements.txt, Python 3.10.15).
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyyaml==6.0.2",
    "requests==2.32.3",
]

[dependency-groups]
# Installed by default by `uv sync` / `uv run`; lets the notebooks run headless.
dev = [
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
]

[tool.uv]
package = false
# Use a uv-managed CPython 3.10.15 (see .python-version), same as feature-extraction.
python-preference = "managed"
# Transitive packages are held at the versions of feature-extraction's original
# conda environment wherever the two environments overlap.
constraint-dependencies = [
    "appnope==0.1.4",
    "asttokens==2.4.1",
    "attrs==24.3.0",
    "beautifulsoup4==4.13.4",
    "certifi==2024.8.30",
    "charset-normalizer==3.4.0",
    "comm==0.2.2",
    "debugpy==1.8.7",
    "decorator==5.1.1",
    "exceptiongroup==1.2.2",
    "executing==2.1.0",
    "fastjsonschema==2.21.1",
    "idna==3.10",
    "ipython==8.28.0",
    "jedi==0.19.1",
    "jinja2==3.1.4",
    "jsonschema-specifications==2025.4.1",
    "jsonschema==4.24.0",
    "jupyter-client==8.6.3",
    "jupyter-core==5.7.2",
    "markupsafe==3.0.2",
    "matplotlib-inline==0.1.7",
    "nbformat==5.10.4",
    "nest-asyncio==1.6.0",
    "packaging==24.1",
    "parso==0.8.4",
    "pexpect==4.9.0",
    "platformdirs==4.3.6",
    "prompt-toolkit==3.0.48",
    "psutil==6.0.0",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.3",
    "pygments==2.18.0",
    "python-dateutil==2.9.0",
    "pytz==2024.2",
    "pyzmq==26.2.0",
    "referencing==0.36.2",
    "rpds-py==0.25.1",
    "six==1.16.0",
    "soupsieve==2.6",
    "stack-data==0.6.2",
    "tornado==6.4.1",
    "traitlets==5.14.3",
    "typing-extensions==4.12.2",
    "tzdata==2024.2",
    "urllib3==2.2.3",
    "wcwidth==0.2.13",
]
