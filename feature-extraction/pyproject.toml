[project]
name = "openmost-feature-extraction"
version = "0.1.0"
description = "Metadata and reproducibility-feature extraction from Elsevier full-text XML (OpenMOST)."
readme = "README.md"
# Original environment: conda env "RR-measure", CPython 3.10.15 on osx-arm64.
requires-python = ">=3.10,<3.11"
# Direct dependencies only (derived from the imports in *.py and *.ipynb),
# pinned to the versions of the original conda environment.
dependencies = [
    # 1_meta.py, 2_xml2md.py
    "lxml==5.3.0",
    # 3_code-p1-gemini.py, 4_a_data-p1-gemini.py
    "google-generativeai==0.8.3",
    # notebooks 5_a .. 8
    "pandas==2.2.3",
    "numpy==1.26.4",
    # 6_clean_regions.ipynb (python-levenshtein is the fuzzywuzzy speed-up;
    # it changes the matcher backend, so it is kept to match the original scores)
    "fuzzywuzzy==0.18.0",
    "python-levenshtein==0.27.1",
    "pycountry==24.6.1",
    "pycountry-convert==0.7.2",
    "geopy==2.4.1",
    # 7_get_citations.ipynb
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    # 8_create_lda.ipynb (gensim 4.3.3 needs numpy<2 and scipy<1.14)
    "gensim==4.3.3",
    "scipy==1.13.1",
    "nltk==3.9.1",
    "spacy==3.8.7",
    "en-core-web-sm",
]

[dependency-groups]
# Needed to run the notebooks (uv sync installs the dev group by default).
dev = [
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
]

[tool.uv]
package = false
# Use a uv-managed CPython (3.10.15, same as the original env; see .python-version).
# The python.org macOS installer build ships without root certificates, which
# makes nltk.download() in 8_create_lda.ipynb fail silently.
python-preference = "managed"
# thinc 8.3.6 (pulled in by spacy 3.8.7) declares numpy>=2, but gensim 4.3.3 needs
# numpy<2. The original environment ran thinc 8.3.6 on numpy 1.26.4 (pip installed
# it despite the conflict), so the numpy requirement is overridden to match it.
override-dependencies = ["numpy==1.26.4"]
# Transitive packages are constrained to the versions of the original conda
# environment (the former requirements.txt), so the lock reproduces it closely.
