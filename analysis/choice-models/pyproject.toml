[project]
name = "openmost-choice-models"
version = "0.1.0"
description = "Biogeme discrete choice models for data and code availability (OpenMOST)"
readme = "README.md"
# Originally developed with Python 3.11.2 (see former Pipfile); any 3.11.x is accepted.
requires-python = ">=3.11,<3.12"
# Direct dependencies, pinned to the versions in the former Pipfile.lock.
dependencies = [
    "biogeme==3.2.13",
    "ipykernel==7.3.0",
    "numpy==1.26.0",
    "pandas==3.0.5",
    "tomlkit==0.14.0",
]

[dependency-groups]
# Tools to open / execute the notebook (`uv run jupyter notebook`, `uv run jupyter nbconvert ...`).
dev = [
    "jupyter==1.1.1",
    "nbconvert==7.17.1",
]

[tool.uv]
package = false
# Pin transitive dependencies to the exact versions of the former Pipfile.lock.
constraint-dependencies = [
    "appnope==0.1.4",
    "asttokens==3.0.2",
    "biogeme-optimization==0.0.5",
    "comm==0.2.3",
    "cython==3.2.9",
    "cythonbiogeme==1.0.2",
    "debugpy==1.8.21",
    "executing==2.2.1",
    "ipython==9.16.1",
    "ipython-pygments-lexers==1.1.1",
    "jedi==0.20.0",
    "jupyter-client==8.9.1",
    "jupyter-core==5.9.1",
    "matplotlib-inline==0.2.2",
    "nest-asyncio2==1.7.2",
    "packaging==26.3",
    "parso==0.8.7",
    "pexpect==4.9.0",
    "platformdirs==4.11.2",
    "prompt-toolkit==3.0.53",
    "psutil==7.2.2",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.3",
    "pygments==2.20.0",
    "python-dateutil==2.9.0.post0",
    "pyzmq==27.1.0",
    "scipy==1.16.3",
    "six==1.17.0",
    "stack-data==0.6.3",
    "tornado==6.5.8",
    "tqdm==4.70.0",
    "traitlets==5.16.1",
    "typing-extensions==4.16.0",
    "wcwidth==0.8.2",
]
